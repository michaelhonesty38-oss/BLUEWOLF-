<style>
/* Layout: a phone-first app column with a Rider / Driver switch. Rider books, driver accepts, and the driver-paid cover card sits at the top of the driver side. Single dark look to match the Blue Wolf brand. */
:root {
  --ink: #060b18;
  --ink-2: #0c1426;
  --ink-3: #131d36;
  --line: #233052;
  --gold: #4f8cff;
  --gold-soft: #9bbcff;
  --text: #ece8dc;
  --muted: #a0a7b8;
  --blue: #6a95ff;
  --cyan: #2dd4bf;
  --good: #4cc38a;
  --bad: #ff8585;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance; }
h2 { font-size: 1.7rem; line-height: 1.05; font-weight: 800; }
h3 { font-size: 1.25rem; line-height: 1.1; font-weight: 800; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(7, 9, 15, 0.95); border-bottom: 1px solid var(--line); }
.top-in { max-width: 520px; margin-inline: auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
.top img { width: 38px; height: 38px; border-radius: 50%; flex: none; }
.top b { font-family: var(--display); font-weight: 800; font-size: 1.2rem; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.mode { margin-left: auto; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.mode.live { color: var(--good); border-color: #245a43; }
.mode.demo { color: var(--gold-soft); border-color: #27498f; }

.app { max-width: 520px; margin-inline: auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 5px; }
.tabs button { min-height: 46px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--gold); color: #031026; }
.note-bar { font-size: 0.85rem; color: var(--gold-soft); background: #0b1a3a; border: 1px solid #1f3e78; border-radius: 12px; padding: 10px 14px; }
.msg { border-radius: 12px; padding: 12px 14px; font-size: 0.92rem; background: #2a1414; border: 1px solid #6b2b2b; color: #ffc9c9; }
.msg[hidden] { display: none; }

.card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card.hl { border-color: #27498f; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.ico { width: 22px; height: 22px; flex: none; display: inline-block; }
.ico svg { width: 100%; height: 100%; display: block; }
.pill { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.on { color: var(--good); border-color: #245a43; background: #0c1f17; }
.pill.gold { color: var(--gold-soft); border-color: #27498f; background: #0b1a3a; }

.btn { min-height: 50px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--gold); background: var(--gold); color: #031026; font-weight: 600; cursor: pointer; width: 100%; }
.btn:hover { background: var(--gold-soft); border-color: var(--gold-soft); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--gold); color: var(--gold-soft); background: transparent; }
.btn.danger { background: transparent; color: var(--bad); border-color: #6b2b2b; }
.btn.danger:hover { background: #2a1414; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btns { display: grid; gap: 10px; }
.btns.two { grid-template-columns: 1fr 1fr; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ph { display: block; width: 100%; max-height: 240px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.ph-sm { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.photo-in { display: grid; gap: 8px; }
.photo-in input[type=file] { display: none; }
.takebtn { text-align: center; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink-3); color: var(--muted); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--text); background: #0b1a3a; }
.seg .chip { justify-content: center; border-radius: 12px; }
label { display: grid; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="search"], input[type="password"] { width: 100%; min-width: 0; min-height: 48px; background: var(--ink-3); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; color: var(--text); font-size: 16px; }
input::placeholder { color: #6d7589; }
.err { color: var(--bad); font-size: 0.85rem; min-height: 1.2em; }
.fare { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.fare b { font-family: var(--display); font-size: 2.2rem; font-weight: 800; color: var(--gold); line-height: 1; }

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps i { height: 6px; border-radius: 3px; background: var(--ink-3); display: block; }
.steps i.on { background: var(--gold); }
.route { display: grid; gap: 4px; }
.route span { overflow-wrap: anywhere; }

  function sendSos() {

  function sendReport() {

    (REST ? call("/reports", "POST", doc) : Promise.resolve()).then(function () { r.step = "done"; }).catch(function () { r.err = "Could not send. Check your connection and try again."; }).then(function () { r.busy = false; renderSheet(); });

  function renderSheet() {
    var el = document.getElementById("sheet"); if (!el) return;

        var note = h("textarea", { id: "sos-note", maxlength: "300", placeholder: "Optional: say what is happening", oninput: function () { sv.note = note.value; } }); note.value = sv.note || "";
        body = [h("h3", { text: "Emergency" }), h("p", { text: "This sends your live location and trip details to the Blue Wolf team right now. If you are in danger, call 112 as well." }), note,
          h("button", { type: "button", class: "btn sosbig", id: "sos-send", disabled: sv.busy, onclick: sendSos }, sv.busy ? "Sending..." : "Send emergency alert"),
          h("a", { class: "btn ghost call", id: "sos-112", href: "tel:112" }, "Call 112 now"), h("button", { type: "button", class: "btn ghost", id: "sos-cancel", onclick: close }, "Cancel")];
      } else if (sv.step === "sent") {
        body = [h("h3", { text: "Alert sent" }), h("p", { id: "sos-sent", text: "Blue Wolf has your location and is looking at it now." + (REST ? "" : " (Practice mode: nothing was really sent.)") + " If you are in danger, call 112 now." }),
          h("a", { class: "btn sosbig call", id: "sos-112", href: "tel:112" }, "Call 112"), h("a", { class: "btn ghost call", href: "tel:" + BLUE_PHONE }, "Call Blue Wolf"), h("button", { type: "button", class: "btn ghost", onclick: close }, "Close")];
      } else {
        body = [h("h3", { text: "Could not reach Blue Wolf" }), h("p", { id: "sos-failed", text: "There may be no network. Call 112 now. You can also send your location to Blue Wolf by SMS, which works without internet." }),
          h("a", { class: "btn sosbig call", id: "sos-112", href: "tel:112" }, "Call 112"), h("a", { class: "btn ghost call", id: "sos-sms", href: sosSmsHref(sv) }, "Send my location by SMS"),
          h("button", { type: "button", class: "btn ghost", onclick: function () { sv.step = "ask"; renderSheet(); } }, "Try again"), h("button", { type: "button", class: "btn ghost", onclick: close }, "Close")];
      }

        .concat(list.length ? list.map(function (o) { return h("button", { type: "button", class: "btn ghost", "data-rep-order": o.id, onclick: function () { rp.oid = o.id; rp.step = "form"; renderSheet(); } }, (TYPES[o.type] || TYPES.ride).name + " " + new Date(o.createdAt || Date.now()).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ", code " + orderCode(o) + (o.riderId === S.uid ? (o.driverLabel ? ", driver " + o.driverLabel : "") : ", customer")); })
          : [h("p", { class: "empty", text: "You have no trips with a driver or customer to report yet." })])
        .concat([h("button", { type: "button", class: "btn ghost", onclick: close }, "Close")]);
    } else if (rp.step === "form") {
      var o2 = S.orders.filter(function (x) { return x.id === rp.oid; })[0], who = o2 && o2.riderId === S.uid ? "the driver" : "the customer";
      var chips = h("div", { class: "list" });
      Object.keys(REPORT_CATS).forEach(function (k) { chips.append(h("button", { type: "button", class: "chip", "data-cat": k, "aria-pressed": String(rp.cat === k), onclick: function () { rp.cat = k; rp.err = ""; renderSheet(); } }, REPORT_CATS[k])); });
      var tx = h("textarea", { id: "rep-text", maxlength: "500", placeholder: "What happened? (optional, but it helps)", oninput: function () { rp.text = tx.value; } }); tx.value = rp.text || "";
      kids = [h("h3", { text: "Report " + who }), h("p", { class: "small muted", text: "Blue Wolf reviews every report and can warn or suspend accounts. In danger right now? Close this and use Emergency, or call 112." }), chips, tx,

        h("button", { type: "button", class: "btn", id: "rep-send", disabled: rp.busy, onclick: sendReport }, rp.busy ? "Sending..." : "Send report"), h("button", { type: "button", class: "btn ghost", onclick: close }, "Cancel")];
    } else {
      kids = [h("h3", { text: "Report sent" }), h("p", { id: "rep-done", text: "Thank you. Blue Wolf will review it" + (REST ? "." : " (Practice mode: nothing was really sent).") + " For anything urgent or dangerous, use the Emergency button or call 112." }), h("button", { type: "button", class: "btn", onclick: close }, "Close")];
    }
    el.append(h("div", { class: "sheet", role: "dialog", "aria-modal": "true" }, kids));
  }
  document.addEventListener("click", function (e) { var a = e.target && e.target.closest ? e.target.closest("#report-link") : null; if (a) { e.preventDefault(); openReport(null); } });
  function render() {
    var m = document.getElementById("mode");
    var label = S.mode === "live" ? "Live" : S.mode === "connecting" ? "Connecting" : S.mode === "error" ? ((REST && (activeRiderOrder() || activeDriverJob())) ? "No network. Trip still active" : "Offline") : "Demo mode";

  function setRole(r) { S.role = r; lsSet("bw_role", r); if (REST && S.uidReal) lsSet("bw_role_" + S.uid, r); render(); window.scrollTo(0, 0); }
