      - name: Install and create the Android project
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync android
      - name: Add permissions
        working-directory: mobile
        run: |
          cat > patch_manifest.py <<'EOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = ["INTERNET", "ACCESS_NETWORK_STATE", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "ACCESS_BACKGROUND_LOCATION",
                   "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_LOCATION", "POST_NOTIFICATIONS", "CAMERA", "VIBRATE", "WAKE_LOCK"]
          add = ""
          for x in perms:
              if 'android.permission.%s"' % x not in s:
                  add += '    <uses-permission android:name="android.permission.%s" />\n' % x
          for f in ["android.hardware.camera", "android.hardware.location.gps"]:
              add += '    <uses-feature android:name="%s" android:required="false" />\n' % f
          s = s.replace("</manifest>", add + "</manifest>")
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          EOF
          python3 patch_manifest.py
      - name: Add the app icon
        working-directory: mobile
        run: |
          pip install pillow
          cat > make_icons.py <<'EOF'
          import os, shutil
          from PIL import Image, ImageDraw
          BG=(0,4,13)
          src=Image.open("icon.png").convert("RGB")
          res="android/app/src/main/res"
          # square master: logo centred on the logo's own dark background
          W=src.size[0]; H=src.size[1]; S=max(W,H)+24
          master=Image.new("RGB",(S,S),BG); master.paste(src,((S-W)//2-6,(S-H)//2-2))
          def logo(px,ring=1.0):
              """Master scaled so the ring spans `ring` of px, on the dark background."""
              inner=int(px*ring); im=master.resize((inner,inner),Image.LANCZOS)
              out=Image.new("RGB",(px,px),BG); out.paste(im,((px-inner)//2,(px-inner)//2)); return out
          shutil.rmtree(res+"/mipmap-anydpi-v26",ignore_errors=True)
          os.makedirs(res+"/mipmap-anydpi-v26",exist_ok=True); os.makedirs(res+"/values",exist_ok=True)
          # legacy icons (Android 7 and older, and some launchers): the logo fills the whole square, the round one is a circle
          for d,px in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              os.makedirs(res+"/mipmap-"+d,exist_ok=True)
              sq=logo(px*4,0.98).resize((px,px),Image.LANCZOS)
              sq.save(res+"/mipmap-"+d+"/ic_launcher.png")
              m=Image.new("L",(px*4,px*4),0); ImageDraw.Draw(m).ellipse((0,0,px*4-1,px*4-1),fill=255); m=m.resize((px,px),Image.LANCZOS)
              r=sq.convert("RGBA"); r.putalpha(m); r.save(res+"/mipmap-"+d+"/ic_launcher_round.png")
          # adaptive icon (Android 8+): the ring fills the visible circle (66% of the 108dp layer), the dark background fills the rest
          for d,px in [("mdpi",108),("hdpi",162),("xhdpi",216),("xxhdpi",324),("xxxhdpi",432)]:
              fg=logo(px*4,0.70).resize((px,px),Image.LANCZOS); fg.save(res+"/mipmap-"+d+"/ic_launcher_foreground.png")
          open(res+"/values/ic_launcher_background.xml","w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#00040D</color></resources>\n')
          ad='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n'
          for n in ("ic_launcher.xml","ic_launcher_round.xml"): open(res+"/mipmap-anydpi-v26/"+n,"w").write(ad)
          print("icons written")
          EOF
          python3 make_icons.py
