          base64 -d splash.b64 > splash_logo.png
          cat > make_splash.py <<'EOF'
          import glob, os, re
          res = "android/app/src/main/res"
          for f in glob.glob(res + "/drawable*/splash.png"): os.remove(f)
          os.makedirs(res + "/drawable", exist_ok=True)
          os.makedirs(res + "/drawable-nodpi", exist_ok=True)
          import shutil; shutil.copy("splash_logo.png", res + "/drawable-nodpi/splash_logo.png")
          open(res + "/values/splash_colors.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="bw_splash_bg">#06183A</color></resources>\n')
          open(res + "/drawable/splash.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item><color android:color="@color/bw_splash_bg"/></item><item android:gravity="center" android:width="180dp" android:height="180dp"><bitmap android:src="@drawable/splash_logo" android:gravity="fill"/></item></layer-list>\n')
          p = res + "/values/styles.xml"
          s = open(p).read()
          s = re.sub(r'(<item name="android:background">)@[a-z]+/[a-z_]+(</item>)', r'\1@drawable/splash\2', s)
          open(p, "w").write(s)
          print("start screen written")
          EOF
          python3 make_splash.py
      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk BlueWolf.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BlueWolf-apk
          path: BlueWolf.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Blue Wolf app (build ${{ github.run_number }})
          body: Download BlueWolf.apk below and open it on your Android phone.
          files: BlueWolf.apk
