# Builds the Blue Wolf Android app (APK) for free on GitHub. Nothing to install on your phone.
# Put this file in your repository at:  .github/workflows/build-apk.yml
# Then: Actions tab > "Build Android APK" > Run workflow. In about 10 minutes the APK appears under Releases.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app.html"
      - "config.js"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check your files are there
        run: |
          test -f app.html || (echo "app.html is missing from the repository" && exit 1)
          test -f config.js || (echo "config.js is missing from the repository" && exit 1)
      - name: Prepare the app project
        run: |
          mkdir -p mobile/www
          cp app.html mobile/www/index.html
          cp config.js mobile/www/config.js
          cp app.html mobile/www/app.html
          cp about.html mobile/www/about.html || true
          cd mobile
          cat > package.json <<'EOF'
          {
            "name": "bluewolf-mobile",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/local-notifications": "^6.1.0",
              "@capacitor-community/background-geolocation": "^1.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ng.bluewolf.app",
            "appName": "Blue Wolf",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          EOF
