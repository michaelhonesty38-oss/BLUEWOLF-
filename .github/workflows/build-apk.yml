      - name: Install and create the Android project
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync android
      - name: Add permissions
        working-directory: mobile
        run: |
          cat > patch_manifest.py <<'EOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = ["INTERNET", "ACCESS_NETWORK_STATE", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "ACCESS_BACKGROUND_LOCATION",
                   "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_LOCATION", "POST_NOTIFICATIONS", "CAMERA", "VIBRATE", "WAKE_LOCK"]
          add = ""
          for x in perms:
              if 'android.permission.%s"' % x not in s:
                  add += '    <uses-permission android:name="android.permission.%s" />\n' % x
          for f in ["android.hardware.camera", "android.hardware.location.gps"]:
              add += '    <uses-feature android:name="%s" android:required="false" />\n' % f
          s = s.replace("</manifest>", add + "</manifest>")
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          EOF
          python3 patch_manifest.py
      - name: Add the app icon
        working-directory: mobile
        run: |
          pip install pillow
          cat > make_icons.py <<'EOF'
          import base64, os, shutil
          from PIL import Image
          master = Image.open("icon.png").convert("RGBA")
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          for d, px in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              os.makedirs(res + "/mipmap-" + d, exist_ok=True)
              im = master.resize((px, px), Image.LANCZOS)
              for n in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  im.save(res + "/mipmap-" + d + "/" + n)
          print("icons written")
          EOF
          python3 make_icons.py
      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk BlueWolf.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BlueWolf-apk
          path: BlueWolf.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Blue Wolf app (build ${{ github.run_number }})
          body: Download BlueWolf.apk below and open it on your Android phone.
          files: BlueWolf.apk
