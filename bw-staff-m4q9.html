<title>Blue Wolf Staff</title>
<style>
:root { --ink:#07090f; --ink-2:#0d1220; --ink-3:#151c2e; --line:#252d42; --gold:#e3ab2f; --gold-soft:#f1d27c; --text:#ece8dc; --muted:#a0a7b8; --good:#4cc38a; --bad:#ff8585; --blue:#6a95ff; --display:"Arial Narrow", Impact, sans-serif; --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .03em; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.1rem; }
.top { position: sticky; top: 0; z-index: 5; background: rgba(7,9,15,.96); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.top img { width: 36px; height: 36px; border-radius: 50%; }
.top b { font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; font-size: 1.2rem; white-space: nowrap; }
.top .sp { margin-left: auto; display: flex; gap: 10px; align-items: center; }
@media (max-width: 560px) { .top .muted.small { display: none; } }
.app { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; display: grid; gap: 14px; }
.card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.warn-t { color: #ff8a80; }
.card.warn { border-color: #6b2b2b; } .card.hl { border-color: #5d4a1a; }
.row { display: flex; gap: 10px; align-items: center; min-width: 0; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--ink-3); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-family: var(--display); font-size: 1.9rem; color: var(--gold); line-height: 1.1; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tabs button { flex: none; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink-2); color: var(--muted); cursor: pointer; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--gold); color: #17110a; border-color: var(--gold); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--bad); color: #200; font-size: .75rem; text-align: center; }
.btn { white-space: nowrap; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--gold); background: var(--gold); color: #17110a; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--bad); border-color: #6b2b2b; }
.btn.good { background: transparent; color: var(--good); border-color: #245a43; }
.btn.armed { background: var(--bad); color: #200; border-color: var(--bad); }
.btn[disabled] { opacity: .5; }
input[type=text], input[type=password], input[type=email], input[type=search] { width: 100%; min-height: 46px; background: var(--ink-3); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; }
label { display: grid; gap: 6px; font-size: .85rem; color: var(--muted); font-weight: 600; }
.pill { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--good); border-color: #245a43; } .pill.bad { color: var(--bad); border-color: #6b2b2b; } .pill.gold { color: var(--gold-soft); border-color: #5d4a1a; }
.kv { display: grid; gap: 2px; font-size: .9rem; } .kv span { color: var(--muted); }
.pre { white-space: pre-line; overflow-wrap: anywhere; }
.err { color: var(--bad); min-height: 1.2em; font-size: .9rem; }
.empty { text-align: center; color: var(--muted); padding: 18px; }
[hidden] { display: none !important; }
.chk { display: flex; align-items: center; gap: 10px; }
.chk input { width: 22px; height: 22px; }
input[type=file] { width: 100%; color: var(--muted); }
textarea { width: 100%; min-height: 70px; background: var(--ink-3); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; }
.logo-s { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; border: 1px solid var(--line); background: #0b1a3a; }
</style>
